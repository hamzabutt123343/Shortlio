appId: com.shortlio.app
productName: Shortlio
copyright: Copyright © Shortlio
directories:
  output: dist
  buildResources: assets
files:
  - src/**/*
  - app-config.json
  - package.json
extraResources:
  - from: resources/engine
    to: engine
    filter:
      - "**/*"
      - "!**/.venv/Lib/site-packages/**/__pycache__/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - "**/*"
  - from: resources/node
    to: node
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Shortlio-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shortlio
portable:
  artifactName: Shortlio-${version}-portable.${ext}
publish: null
